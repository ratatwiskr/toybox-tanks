name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Full verification
        run: npm run verify

      - name: Cross-browser release smoke
        run: npm run test:browsers

      - name: Prepare verified Pages output
        if: github.ref == 'refs/heads/main'
        run: |
          test -s dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/deployed-commit.txt

      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file artifact
        run: npm run build:single

      - name: Validate single-file artifact
        run: |
          set -euo pipefail
          test -s dist/index.html
          printf 'Single-file artifact: `dist/index.html`\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Add source provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_SHA" > dist/deployed-commit.txt
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$SOURCE_BRANCH" \
            --arg sha "$SOURCE_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{repository: $repository, branch: $branch, sha: $sha, run: $run}' \
            > dist/playtest-source.json

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: toybox-tanks-single-html-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main'
    needs: [verify, artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download single-file artifact
        uses: actions/download-artifact@v4
        with:
          name: toybox-tanks-single-html-${{ github.run_number }}
          path: dist

      - name: Create release tag
        id: tag
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="build-${RUN_NUMBER}-${RUN_ID}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Toybox Tanks build ${{ github.run_number }}
          body: |
            Automated single-file build from `main`.

            Commit: `${{ github.sha }}`
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            dist/index.html
            dist/deployed-commit.txt
            dist/playtest-source.json
          make_latest: true

  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Skip an obsolete main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: main has advanced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Pages
        if: steps.current.outputs.current == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy verified artifact
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v4

  pages-smoke:
    needs: deploy-pages
    if: needs.deploy-pages.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PAGES_BASE_URL: ${{ needs.deploy-pages.outputs.page_url }}
      PAGES_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test published Pages site
        run: npm run test:pages

      - name: Record published revision
        run: |
          printf 'Pages smoke passed: %s\n\nCommit: `%s`\n' \
            "$PAGES_BASE_URL" "$PAGES_EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-artifacts
          path: |
            playwright-report/pages/
            test-results/pages/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
